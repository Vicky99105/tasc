<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Candidate Match</title>
<style>
  :root { --ink:#1a1f1e; --ink-2:#5b625f; --ground:#f7f6f3; --sunk:#ececE7; --accent:#136a63; --rule:#ddd9d2; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", sans-serif; background:var(--ground); color:var(--ink); }
  #app { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--rule); font-weight: 600; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 90%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; line-height: 1.45; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; }
  .assistant { align-self: flex-start; background: #fff; border: 1px solid var(--rule); }
  .tool { align-self: flex-start; background: var(--sunk); border: 1px solid var(--rule); font-family: ui-monospace, monospace; font-size: 0.82em; color: var(--ink-2); padding: 8px 12px; border-radius: 8px; }
  .tool b { color: var(--ink); }
  .interrupt { align-self: stretch; background: #fff8e8; border: 1px solid #e0c073; border-radius: 10px; padding: 12px 16px; }
  .interrupt h4 { margin: 0 0 8px; }
  .interrupt pre { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.85em; }
  .interrupt .hint { color: var(--ink-2); font-size: 0.85em; margin-top: 8px; }
  #inputRow { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--rule); }
  #input { flex: 1; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; font-size: 1em; }
  #send { padding: 10px 18px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  #send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>Candidate Match</header>
  <div id="log"></div>
  <div id="inputRow">
    <input id="input" placeholder="e.g. match for the DevOps role, or approve / amend / ask / reject" autofocus>
    <button id="send">Send</button>
  </div>
</div>
<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let sessionId = null;

function addMsg(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function addTool(node, summary) {
  const el = document.createElement('div');
  el.className = 'tool';
  el.innerHTML = '<b>' + node + '</b>  ' + JSON.stringify(summary);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function addInterrupt(gate, payload) {
  const el = document.createElement('div');
  el.className = 'interrupt';
  let body = '';
  if (gate === 'approve_rubric') {
    body = '<h4>⏸ Rubric ready — ' + payload.role_id + '</h4>' +
           '<pre>' + payload.diff_en + '\n\nweights: ' + JSON.stringify(payload.rubric.weights) +
           '\nthreshold: ' + payload.rubric.shortlist_threshold +
           '\n\n' + payload.rubric.requirements.map(r => '[' + r.tier + '] ' + r.source).join('\n') +
           '\n\nest. cost so far: $' + payload.est_cost + '</pre>' +
           '<div class="hint">Reply: approve / amend &lt;guidance&gt; / ask &lt;question&gt; / reject</div>';
  } else {
    body = '<h4>⏸ Summary ready — ' + payload.role_id + '</h4>' +
           '<pre>' + payload.markdown + '</pre>' +
           '<div class="hint">Reply: approve / edit &lt;note&gt; / change_rubric &lt;guidance&gt; / ask &lt;question&gt; / reject</div>';
  }
  el.innerHTML = body;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

async function ensureSession() {
  if (sessionId) return sessionId;
  const r = await fetch('/session', { method: 'POST' });
  const d = await r.json();
  sessionId = d.session_id;
  return sessionId;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('user', text);
  await ensureSession();

  const resp = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, message: text }),
  });
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const part of parts) {
      if (!part.startsWith('data: ')) continue;
      const evt = JSON.parse(part.slice(6));
      if (evt.type === 'assistant_text') addMsg('assistant', evt.text);
      else if (evt.type === 'tool_call') addTool(evt.node, evt.summary);
      else if (evt.type === 'interrupt') addInterrupt(evt.gate, evt.payload);
      else if (evt.type === 'done') { /* stream finished */ }
    }
  }
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
addMsg('assistant', 'Which role would you like to match candidates for? (e.g. "DevOps Engineer" or "R008")');
</script>
</body>
</html>
