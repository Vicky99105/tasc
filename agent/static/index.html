<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidate Match Intelligence</title>
<style>
  :root {
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --ink-primary: #0f172a;
    --ink-secondary: #475569;
    --ink-muted: #94a3b8;
    --accent: #0f766e;
    --accent-hover: #115e59;
    --accent-light: #ccfbf1;
    --accent-text: #134e4a;
    --border: #e2e8f0;
    --border-subtle: #cbd5e1;
    --tool-bg: #f1f5f9;
    --tool-border: #cbd5e1;
    --gate-bg: #fffbeb;
    --gate-border: #fcd34d;
    --gate-accent: #b45309;
    --success-bg: #f0fdf4;
    --success-border: #86efac;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink-primary);
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 860px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  header {
    padding: 16px 24px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--ink-primary);
  }

  .badge-live {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 9999px;
    background: var(--accent-light);
    color: var(--accent-text);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  /* Messages */
  .msg {
    max-width: 88%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.55;
    font-size: 0.95rem;
    box-shadow: var(--shadow-sm);
  }

  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--ink-primary);
    border-bottom-left-radius: 4px;
  }

  /* Tool Call Execution Steps */
  .tool-node {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    color: var(--ink-secondary);
    font-size: 0.82rem;
    padding: 6px 12px;
    border-radius: 20px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .tool-node .icon {
    font-size: 0.85rem;
  }

  .tool-node strong {
    color: var(--ink-primary);
  }

  .tool-node .meta {
    color: var(--ink-secondary);
  }

  /* Interrupt & Gate Cards */
  .gate-card {
    align-self: stretch;
    background: #ffffff;
    border: 1px solid var(--gate-border);
    border-left: 5px solid var(--gate-accent);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: var(--shadow-md);
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .gate-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .gate-title {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .gate-cost {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    background: #f1f5f9;
    color: var(--ink-secondary);
  }

  .rubric-weights-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
  }

  .weight-pill {
    font-size: 0.8rem;
    padding: 4px 10px;
    border-radius: 6px;
    background: #f8fafc;
    border: 1px solid var(--border);
    color: var(--ink-secondary);
  }

  .weight-pill b {
    color: var(--ink-primary);
  }

  .req-list {
    margin: 12px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .req-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    color: var(--ink-primary);
  }

  .req-badge {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 4px;
  }

  .req-badge.required { background: #fee2e2; color: #991b1b; }
  .req-badge.preferred { background: #e0e7ff; color: #3730a3; }

  /* Candidate Summary Markdown Rendering */
  .formatted-content {
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--ink-primary);
  }

  .formatted-content h1 { font-size: 1.3rem; margin: 16px 0 8px; color: var(--ink-primary); border-bottom: 2px solid var(--border); padding-bottom: 6px; }
  .formatted-content h2 { font-size: 1.15rem; margin: 18px 0 6px; color: var(--accent); display: flex; justify-content: space-between; }
  .formatted-content h3 { font-size: 1rem; margin: 12px 0 4px; }
  .formatted-content p { margin: 8px 0; }
  .formatted-content ul { margin: 6px 0 12px; padding-left: 20px; }
  .formatted-content li { margin-bottom: 4px; }
  .formatted-content hr { border: none; border-top: 1px dashed var(--border); margin: 20px 0; }
  .formatted-content em { color: var(--ink-secondary); font-style: italic; }

  /* Action Buttons / Chips */
  .action-chips {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .chip-label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-muted);
    margin-right: 4px;
  }

  .action-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--ink-primary);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .action-btn:hover {
    background: var(--bg);
    border-color: var(--border-subtle);
    transform: translateY(-1px);
  }

  .action-btn.primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .action-btn.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .action-btn.danger:hover {
    background: #fee2e2;
    color: #991b1b;
    border-color: #fca5a5;
  }

  /* Animated Typing / Loading Indicator */
  .typing-indicator {
    align-self: flex-start;
    display: none;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 20px;
    box-shadow: var(--shadow-sm);
  }

  .typing-indicator.active {
    display: flex;
  }

  .typing-text {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink-secondary);
    margin-right: 4px;
  }

  .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.4s infinite ease-in-out both;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1.1); opacity: 1; }
  }

  /* Input Row */
  #inputRow {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    background: #ffffff;
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 10px rgb(0 0 0 / 0.02);
  }

  #input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
  }

  #send {
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  #send:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  #send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span>Candidate Match Intelligence</span>
      <span class="badge-live">Live</span>
    </div>
  </header>

  <div id="log"></div>

  <div id="typingIndicator" class="typing-indicator">
    <span class="typing-text" id="typingStatus">Agent is thinking...</span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <div id="inputRow">
    <input id="input" placeholder="Type a role name (e.g. 'DevOps Engineer', 'R009') or your instructions..." autofocus>
    <button id="send">Send</button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const typingIndicator = document.getElementById('typingIndicator');
const typingStatus = document.getElementById('typingStatus');
let sessionId = null;

// Lightweight Markdown to HTML Parser
function renderMarkdown(md) {
  if (!md) return '';
  let html = md
    // Escape standard tags
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    // Headers
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    // Bold and Italic
    .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/gim, '<em>$1</em>')
    .replace(/_(.*?)_/gim, '<em>$1</em>')
    // Dividers
    .replace(/^---$/gim, '<hr>')
    // Unordered lists
    .replace(/^\s*-\s+(.*$)/gim, '<li>$1</li>')
    .replace(/^\s*\*\s+(.*$)/gim, '<li>$1</li>')
    // Ordered lists
    .replace(/^\s*(\d+)\.\s+(.*$)/gim, '<li><strong>$1.</strong> $2</li>');

  // Wrap continuous list items into <ul>
  html = html.replace(/(<li>[\s\S]*?<\/li>)/gm, '<ul>$1</ul>');
  html = html.replace(/<\/ul>\s*<ul>/g, '');

  // Wrap paragraphs
  html = html.split('\n\n').map(p => {
    p = p.trim();
    if (!p) return '';
    if (p.startsWith('<h') || p.startsWith('<ul') || p.startsWith('<hr')) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');

  return html;
}

function showTyping(statusText = 'Agent is processing...') {
  typingStatus.textContent = statusText;
  typingIndicator.classList.add('active');
  log.scrollTop = log.scrollHeight;
}

function hideTyping() {
  typingIndicator.classList.remove('active');
}

function addMsg(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function addTool(node, summary) {
  const el = document.createElement('div');
  el.className = 'tool-node';

  let icon = '⚡';
  let label = node;
  let detail = '';

  if (node === 'list_roles') {
    icon = '📋';
    label = 'Loaded open roles';
  } else if (node === 'compile_rubric') {
    icon = '⚙️';
    label = 'Compiled rubric';
    if (summary.est_cost !== undefined) detail = ` (est. cost: $${Number(summary.est_cost).toFixed(4)})`;
  } else if (node === 'run_match') {
    icon = '🎯';
    label = 'Matched candidates';
    if (summary.finalists !== undefined) detail = ` (${summary.finalists} finalists, ${summary.excluded} excluded)`;
  } else if (node === 'render_brief') {
    icon = '📝';
    label = 'Rendered briefs';
    if (summary.candidates_briefed !== undefined) detail = ` (${summary.candidates_briefed} briefs)`;
  } else if (node === 'send_to_slack') {
    icon = '🚀';
    label = 'Dispatched to Slack';
  } else if (node === 'answer_question') {
    icon = '💡';
    label = 'Evaluated recruiter question';
  }

  el.innerHTML = `<span class="icon">${icon}</span><strong>${label}</strong><span class="meta">${detail}</span>`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function addInterrupt(gate, payload) {
  const el = document.createElement('div');
  el.className = 'gate-card';

  if (gate === 'approve_rubric') {
    const weights = payload.rubric.weights || {};
    const reqsHtml = (payload.rubric.requirements || []).map(r => 
      `<div class="req-item">
        <span class="req-badge ${r.tier}">${r.tier}</span>
        <span>${r.source}</span>
      </div>`
    ).join('');

    el.innerHTML = `
      <div class="gate-header">
        <h4 class="gate-title">⏸ Rubric Ready — Role ${payload.role_id}</h4>
        <span class="gate-cost">Est. Cost: $${Number(payload.est_cost || 0).toFixed(4)}</span>
      </div>
      <p style="margin: 6px 0 10px; font-size: 0.92rem; color: var(--ink-secondary);">${payload.diff_en}</p>
      <div class="rubric-weights-row">
        <span class="weight-pill">Required: <b>${weights.required || 0}%</b></span>
        <span class="weight-pill">Preferred: <b>${weights.preferred || 0}%</b></span>
        <span class="weight-pill">Location: <b>${weights.location || 0}%</b></span>
        <span class="weight-pill">Availability: <b>${weights.availability || 0}%</b></span>
        <span class="weight-pill">Threshold: <b>${payload.rubric.shortlist_threshold || 56}</b></span>
      </div>
      <div class="req-list">
        ${reqsHtml}
      </div>
      <div class="action-chips">
        <span class="chip-label">Quick Actions:</span>
        <button class="action-btn primary" onclick="submitQuickAction('approve')">✓ Approve Rubric</button>
        <button class="action-btn" onclick="populatePrompt('amend Increase location priority to focus only on local candidates')">✏️ Amend Guidance...</button>
        <button class="action-btn" onclick="populatePrompt('ask What are the primary must-have skills?')">💬 Ask Question...</button>
        <button class="action-btn danger" onclick="submitQuickAction('reject')">✕ Reject</button>
      </div>
    `;
  } else {
    // Summary Gate
    const formattedHtml = renderMarkdown(payload.markdown);
    el.innerHTML = `
      <div class="gate-header">
        <h4 class="gate-title">⏸ Candidate Shortlist & Summary — ${payload.role_id}</h4>
      </div>
      <div class="formatted-content">
        ${formattedHtml}
      </div>
      <div class="action-chips">
        <span class="chip-label">Quick Actions:</span>
        <button class="action-btn primary" onclick="submitQuickAction('approve')">✓ Approve & Send Summary</button>
        <button class="action-btn" onclick="populatePrompt('edit Add a note about relocation flexibility for top candidates')">📝 Edit Note...</button>
        <button class="action-btn" onclick="populatePrompt('change_rubric Filter out anyone with more than 30 days notice')">🔄 Change Rubric...</button>
        <button class="action-btn" onclick="populatePrompt('ask Why was candidate C087 included?')">💬 Ask Question...</button>
        <button class="action-btn danger" onclick="submitQuickAction('reject')">✕ Reject</button>
      </div>
    `;
  }

  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function populatePrompt(text) {
  input.value = text;
  input.focus();
  input.setSelectionRange(text.length, text.length);
}

function submitQuickAction(text) {
  input.value = text;
  send();
}

async function ensureSession() {
  if (sessionId) return sessionId;
  const r = await fetch('/session', { method: 'POST' });
  const d = await r.json();
  sessionId = d.session_id;
  return sessionId;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('user', text);
  showTyping('Matching & evaluating...');
  await ensureSession();

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        const evt = JSON.parse(part.slice(6));
        if (evt.type === 'assistant_text') {
          hideTyping();
          addMsg('assistant', evt.text);
        } else if (evt.type === 'tool_call') {
          showTyping(`Running ${evt.node}...`);
          addTool(evt.node, evt.summary);
        } else if (evt.type === 'interrupt') {
          hideTyping();
          addInterrupt(evt.gate, evt.payload);
        } else if (evt.type === 'done') {
          hideTyping();
        }
      }
    }
  } catch (err) {
    console.error(err);
    addMsg('assistant', 'An error occurred while communicating with the agent.');
  } finally {
    hideTyping();
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
addMsg('assistant', '👋 Welcome! Which role would you like to match candidates for? (e.g. "DevOps Engineer", "Technical Recruiter", or role ID "R009")');
</script>
</body>
</html>
