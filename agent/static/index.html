<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidate Match Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --surface-hover: #faf9f6;
    --ink: #192127;
    --ink-secondary: #4a5560;
    --ink-muted: #7c8894;
    --border: #e4e0d7;
    --border-light: #ece9e2;
    --accent: #136a63;
    --accent-hover: #0e534d;
    --accent-soft: #eaf4f3;
    --accent-ink: #0b4540;
    --amber-bg: #fdfbf3;
    --amber-border: #faeac4;
    --amber-ink: #8a5a1e;
    --amber-tag: #fdf4dc;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
    --radius-sm: 6px;
    --radius-md: 8px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 820px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    box-shadow: var(--shadow-md);
  }

  /* Header */
  header {
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--ink);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
  }

  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-secondary);
    padding: 4px 10px;
    font-size: 0.76rem;
    font-weight: 500;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-ghost:hover {
    background: var(--bg);
    color: var(--ink);
  }

  /* Chat Log */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  /* Message Bubbles */
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    line-height: 1.5;
    font-size: 0.88rem;
    box-shadow: var(--shadow-sm);
  }

  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #ffffff;
    border-bottom-right-radius: 2px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--ink);
    border-bottom-left-radius: 2px;
  }

  /* Execution Step Badges (Clean White Pill) */
  .tool-node {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--ink-secondary);
    font-size: 0.76rem;
    padding: 4px 10px;
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
    margin: 2px 0;
  }

  .tool-node .icon {
    font-size: 0.82rem;
  }

  .tool-node strong {
    color: var(--ink);
    font-weight: 600;
  }

  .tool-node .meta {
    color: var(--ink-muted);
    font-family: "JetBrains Mono", monospace;
    font-size: 0.72rem;
  }

  /* Approval Gate Cards */
  .gate-card {
    align-self: stretch;
    background: var(--amber-bg);
    border: 1px solid var(--amber-border);
    border-left: 4px solid var(--amber-ink);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    animation: slideUp 0.2s ease-out;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .gate-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .gate-title {
    margin: 0;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--ink);
  }

  .gate-cost {
    font-size: 0.72rem;
    font-weight: 500;
    padding: 2px 6px;
    border-radius: var(--radius-sm);
    background: var(--amber-tag);
    color: var(--amber-ink);
    font-family: "JetBrains Mono", monospace;
  }

  .gate-desc {
    margin: 4px 0 10px;
    font-size: 0.84rem;
    color: var(--ink-secondary);
  }

  .rubric-weights-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0 10px;
  }

  .weight-pill {
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: var(--radius-sm);
    background: #ffffff;
    border: 1px solid var(--border-light);
    color: var(--ink-secondary);
  }

  .weight-pill b {
    color: var(--ink);
  }

  .req-list {
    margin: 8px 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .req-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.82rem;
    color: var(--ink);
  }

  .req-badge {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 5px;
    border-radius: 4px;
  }

  .req-badge.required { background: #fee2e2; color: #991b1b; }
  .req-badge.preferred { background: #e0e7ff; color: #3730a3; }

  /* Candidate Cards */
  .formatted-content h1 {
    font-size: 1.05rem;
    margin: 4px 0 10px;
    color: var(--ink);
    font-weight: 700;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--amber-border);
  }

  .candidate-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    margin: 10px 0;
    box-shadow: var(--shadow-sm);
  }

  .candidate-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .candidate-name {
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--ink);
  }

  .score-badge {
    background: var(--accent-soft);
    color: var(--accent-ink);
    font-weight: 700;
    font-size: 0.78rem;
    padding: 2px 7px;
    border-radius: 12px;
    font-family: "JetBrains Mono", monospace;
  }

  .candidate-headline {
    font-size: 0.8rem;
    color: var(--ink-secondary);
    font-style: italic;
    margin-bottom: 8px;
  }

  .diff-box {
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    font-size: 0.8rem;
    color: var(--ink);
    margin: 6px 0;
    border: 1px solid var(--border-light);
  }

  .diff-box strong {
    color: var(--ink-secondary);
  }

  .section-label {
    font-size: 0.74rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    margin: 8px 0 4px;
  }

  .strengths-list {
    margin: 4px 0 6px;
    padding-left: 18px;
    font-size: 0.8rem;
  }

  .strengths-list li {
    margin-bottom: 2px;
  }

  .questions-list {
    margin: 4px 0;
    padding-left: 18px;
    font-size: 0.8rem;
    color: var(--ink);
  }

  .questions-list li {
    margin-bottom: 4px;
  }

  /* Action Buttons / Chips */
  .action-chips {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--amber-border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .chip-label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    margin-right: 2px;
  }

  .action-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--ink);
    padding: 5px 11px;
    border-radius: var(--radius-sm);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .action-btn:hover {
    background: var(--surface-hover);
    border-color: var(--ink-muted);
    transform: translateY(-1px);
  }

  .action-btn.primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    font-weight: 600;
  }

  .action-btn.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .action-btn.danger:hover {
    background: #fee2e2;
    color: #991b1b;
    border-color: #fca5a5;
  }

  /* Inline Typing & Running Indicator (Inside Chat Log) */
  .typing-indicator {
    align-self: flex-start;
    display: none;
    align-items: center;
    gap: 7px;
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
    margin: 4px 0;
  }

  .typing-indicator.active {
    display: inline-flex;
  }

  .typing-text {
    font-size: 0.76rem;
    font-weight: 500;
    color: var(--ink-secondary);
  }

  .dot-pulse {
    display: flex;
    gap: 3px;
    align-items: center;
  }

  .dot {
    width: 4px;
    height: 4px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 1.2s infinite ease-in-out both;
  }

  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1.2); opacity: 1; }
  }

  /* Input Bar */
  #inputRow {
    display: flex;
    gap: 8px;
    padding: 12px 18px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.02);
  }

  #input {
    flex: 1;
    padding: 9px 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 0.88rem;
    background: #ffffff;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(19, 106, 99, 0.15);
  }

  #send {
    padding: 9px 18px;
    border: none;
    border-radius: var(--radius-md);
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s ease, opacity 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  #send:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  #send:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="status-dot"></span>
      <span>Candidate Match Intelligence</span>
    </div>
    <div>
      <button class="btn-ghost" onclick="resetSession()">+ New Session</button>
    </div>
  </header>

  <div id="log">
    <!-- Messages and execution badges land here -->
  </div>

  <div id="inputRow">
    <input id="input" placeholder="Type a role name (e.g. 'Technical Recruiter', 'R009') or instructions..." autofocus>
    <button id="send">Send</button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let sessionId = localStorage.getItem('tasc_session_id') || null;

// Create dynamic typing indicator inside log
let typingEl = document.createElement('div');
typingEl.className = 'typing-indicator';
typingEl.innerHTML = '<span class="typing-text" id="typingStatus">Processing...</span><div class="dot-pulse"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';

function formatCandidateSummary(md) {
  if (!md) return '';
  const lines = md.trim().split('\n');
  let roleTitle = 'Candidate Shortlist';
  for (const l of lines) {
    if (l.startsWith('# ')) {
      roleTitle = l.slice(2).trim();
      break;
    }
  }

  const parts = md.split('\n## ');
  let cardsHtml = '';

  for (let i = 1; i < parts.length; i++) {
    const section = parts[i];
    const clines = section.trim().split('\n');
    const headerLine = clines[0];
    const [cid, score] = headerLine.includes('—') ? headerLine.split('—').map(s => s.trim()) : [headerLine, ''];

    let headline = '';
    let summary = '';
    let diff = '';
    let strengths = [];
    let experience = '';
    let questions = [];

    let mode = 'body';
    for (let j = 1; j < clines.length; j++) {
      const line = clines[j].trim();
      if (!line || line === '---') continue;

      if (line.startsWith('_') && line.endsWith('_') && !headline) {
        headline = line.slice(1, -1).trim();
      } else if (line.startsWith('**What sets them apart:**')) {
        diff = line.replace('**What sets them apart:**', '').trim();
      } else if (line.startsWith('**Strengths**')) {
        mode = 'strengths';
      } else if (line.startsWith('**Relevant experience:**')) {
        experience = line.replace('**Relevant experience:**', '').trim();
        mode = 'body';
      } else if (line.startsWith('**Questions**')) {
        mode = 'questions';
      } else if (mode === 'strengths' && line.startsWith('- ')) {
        strengths.push(line.slice(2));
      } else if (mode === 'questions' && /^\d+\./.test(line)) {
        questions.push(line.replace(/^\d+\.\s*/, ''));
      } else if (mode === 'body' && !line.startsWith('**') && !line.startsWith('_')) {
        if (!summary) summary = line;
      }
    }

    const strengthsHtml = strengths.map(s => `<li>${escapeHtml(s)}</li>`).join('');
    const questionsHtml = questions.map(q => `<li>${escapeHtml(q)}</li>`).join('');

    cardsHtml += `
      <div class="candidate-card">
        <div class="candidate-card-header">
          <span class="candidate-name">${escapeHtml(cid)}</span>
          <span class="score-badge">Score: ${escapeHtml(score)}</span>
        </div>
        ${headline ? `<div class="candidate-headline">${escapeHtml(headline)}</div>` : ''}
        ${summary ? `<p style="margin:4px 0 8px; font-size:0.8rem; color:var(--ink);">${escapeHtml(summary)}</p>` : ''}
        ${diff ? `<div class="diff-box"><strong>What sets them apart:</strong> ${escapeHtml(diff)}</div>` : ''}
        ${strengths.length ? `
          <div class="section-label">Key Strengths</div>
          <ul class="strengths-list">${strengthsHtml}</ul>
        ` : ''}
        ${experience ? `
          <div style="font-size:0.78rem; color:var(--ink-secondary); margin:4px 0;"><strong>Relevant experience:</strong> ${escapeHtml(experience)}</div>
        ` : ''}
        ${questions.length ? `
          <div class="section-label" style="margin-top:6px;">Suggested Interview Questions</div>
          <ol class="questions-list">${questionsHtml}</ol>
        ` : ''}
      </div>
    `;
  }

  return `<h1>${escapeHtml(roleTitle)}</h1>${cardsHtml || '<p>No candidates available.</p>'}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showTyping(statusText = 'Processing...') {
  const label = typingEl.querySelector('.typing-text');
  if (label) label.textContent = statusText;
  typingEl.classList.add('active');
  log.appendChild(typingEl);
  log.scrollTop = log.scrollHeight;
}

function hideTyping() {
  typingEl.classList.remove('active');
  if (typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
}

function saveLog() {
  localStorage.setItem('tasc_log_html', log.innerHTML);
}

function loadLog() {
  const saved = localStorage.getItem('tasc_log_html');
  if (saved) {
    log.innerHTML = saved;
    log.scrollTop = log.scrollHeight;
  } else {
    addMsg('assistant', '👋 Welcome! Which role would you like to match candidates for? (e.g. "Technical Recruiter", "DevOps Engineer", or "R009")');
  }
}

function resetSession() {
  localStorage.removeItem('tasc_session_id');
  localStorage.removeItem('tasc_log_html');
  sessionId = null;
  log.innerHTML = '';
  addMsg('assistant', 'Started a fresh session. Which role would you like to match candidates for?');
}

function addMsg(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  saveLog();
  return el;
}

function addTool(node, summary) {
  const el = document.createElement('div');
  el.className = 'tool-node';

  let icon = '⚡';
  let label = node;
  let detail = '';

  if (node === 'list_roles') {
    icon = '📋';
    label = 'Loaded open roles';
  } else if (node === 'compile_rubric') {
    icon = '⚙️';
    label = 'Compiled rubric';
    if (summary.est_cost !== undefined) detail = ` (est. $${Number(summary.est_cost).toFixed(4)})`;
  } else if (node === 'approve_rubric') {
    icon = '✓';
    label = 'Rubric Approved';
  } else if (node === 'run_match') {
    icon = '🎯';
    label = 'Matched candidates';
    if (summary.finalists !== undefined) detail = ` (${summary.finalists} finalists, ${summary.excluded} excluded)`;
  } else if (node === 'render_brief') {
    icon = '📝';
    label = 'Rendered briefs';
    if (summary.candidates_briefed !== undefined) detail = ` (${summary.candidates_briefed} briefs)`;
  } else if (node === 'approve_summary') {
    icon = '✓';
    label = 'Shortlist Approved';
  } else if (node === 'send_to_slack') {
    icon = '🚀';
    label = 'Dispatched to Slack';
  } else if (node === 'answer_question') {
    icon = '💡';
    label = 'Evaluated question';
  }

  el.innerHTML = `<span class="icon">${icon}</span><strong>${label}</strong><span class="meta">${detail}</span>`;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  saveLog();
}

function addInterrupt(gate, payload) {
  const el = document.createElement('div');
  el.className = 'gate-card';

  if (gate === 'approve_rubric') {
    const weights = payload.rubric.weights || {};
    const reqsHtml = (payload.rubric.requirements || []).map(r => 
      `<div class="req-item">
        <span class="req-badge ${r.tier}">${r.tier}</span>
        <span>${escapeHtml(r.source)}</span>
      </div>`
    ).join('');

    el.innerHTML = `
      <div class="gate-header">
        <h4 class="gate-title">⏸ Rubric Ready &mdash; ${escapeHtml(payload.role_id)}</h4>
        <span class="gate-cost">Est. $${Number(payload.est_cost || 0).toFixed(4)}</span>
      </div>
      <div class="gate-desc">${escapeHtml(payload.diff_en)}</div>
      <div class="rubric-weights-row">
        <span class="weight-pill">Required: <b>${weights.required || 0}%</b></span>
        <span class="weight-pill">Preferred: <b>${weights.preferred || 0}%</b></span>
        <span class="weight-pill">Location: <b>${weights.location || 0}%</b></span>
        <span class="weight-pill">Availability: <b>${weights.availability || 0}%</b></span>
        <span class="weight-pill">Threshold: <b>${payload.rubric.shortlist_threshold || 56}</b></span>
      </div>
      <div class="req-list">
        ${reqsHtml}
      </div>
      <div class="action-chips">
        <span class="chip-label">Actions:</span>
        <button class="action-btn primary" onclick="submitQuickAction('approve')">✓ Approve Rubric</button>
        <button class="action-btn" onclick="populatePrompt('amend Increase location priority to focus only on local candidates')">✏️ Amend...</button>
        <button class="action-btn" onclick="populatePrompt('ask What are the primary must-have skills?')">💬 Ask Question...</button>
        <button class="action-btn danger" onclick="submitQuickAction('reject')">✕ Reject</button>
      </div>
    `;
  } else {
    // Summary Gate
    const formattedHtml = formatCandidateSummary(payload.markdown);
    el.innerHTML = `
      <div class="gate-header">
        <h4 class="gate-title">⏸ Candidate Shortlist Ready &mdash; ${escapeHtml(payload.role_id)}</h4>
      </div>
      <div class="formatted-content">
        ${formattedHtml}
      </div>
      <div class="action-chips">
        <span class="chip-label">Actions:</span>
        <button class="action-btn primary" onclick="submitQuickAction('approve')">✓ Approve & Send to Slack</button>
        <button class="action-btn" onclick="populatePrompt('edit Add a note about candidate relocation flexibility')">📝 Edit...</button>
        <button class="action-btn" onclick="populatePrompt('change_rubric Filter out anyone with more than 30 days notice')">🔄 Change Rubric...</button>
        <button class="action-btn" onclick="populatePrompt('ask Why was candidate C087 included?')">💬 Ask Question...</button>
        <button class="action-btn danger" onclick="submitQuickAction('reject')">✕ Reject</button>
      </div>
    `;
  }

  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  saveLog();
}

function populatePrompt(text) {
  input.value = text;
  input.focus();
  input.setSelectionRange(text.length, text.length);
}

function submitQuickAction(text) {
  input.value = text;
  send();
}

async function ensureSession() {
  if (sessionId) return sessionId;
  const r = await fetch('/session', { method: 'POST' });
  const d = await r.json();
  sessionId = d.session_id;
  localStorage.setItem('tasc_session_id', sessionId);
  return sessionId;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  input.disabled = true;
  addMsg('user', text);
  showTyping('Matching & evaluating...');
  await ensureSession();

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        const evt = JSON.parse(part.slice(6));
        if (evt.type === 'assistant_text') {
          hideTyping();
          addMsg('assistant', evt.text);
        } else if (evt.type === 'tool_call') {
          showTyping(`Executing ${evt.node}...`);
          addTool(evt.node, evt.summary);
        } else if (evt.type === 'interrupt') {
          hideTyping();
          addInterrupt(evt.gate, evt.payload);
        } else if (evt.type === 'done') {
          hideTyping();
        }
      }
    }
  } catch (err) {
    console.error(err);
    addMsg('assistant', 'An error occurred while communicating with the agent.');
  } finally {
    hideTyping();
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
    saveLog();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// Load session on startup
loadLog();
</script>
